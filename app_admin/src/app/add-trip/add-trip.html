<div class="container">
  <h2>Add Trip</h2>

  <form (ngSubmit)="addTrip()">

    <div class="mb-3">
      <label for="code" class="form-label">Trip Code</label>
      <input type="text"
             class="form-control"
             id="code"
             name="code"
             [(ngModel)]="newTrip.code"
             required>
    </div>

    <div class="mb-3">
      <label for="name" class="form-label">Trip Name</label>
      <input type="text"
             class="form-control"
             id="name"
             name="name"
             [(ngModel)]="newTrip.name"
             required>
    </div>

    <div class="mb-3">
      <label for="length" class="form-label">Length</label>
      <input type="text"
             class="form-control"
             id="length"
             name="length"
             [(ngModel)]="newTrip.length"
             required>
    </div>

    <div class="mb-3">
      <label for="start" class="form-label">Start Date</label>
      <input type="date"
             class="form-control"
             id="start"
             name="start"
             [(ngModel)]="newTrip.start"
             required>
    </div>

    <div class="mb-3">
      <label for="resort" class="form-label">Resort</label>
      <input type="text"
             class="form-control"
             id="resort"
             name="resort"
             [(ngModel)]="newTrip.resort"
             required>
    </div>

    <div class="mb-3">
      <label for="perPerson" class="form-label">Price Per Person</label>
      <input type="text"
             class="form-control"
             id="perPerson"
             name="perPerson"
             [(ngModel)]="newTrip.perPerson"
             required>
    </div>

    <div class="mb-3">
      <label for="image" class="form-label">Image</label>
      <input type="text"
             class="form-control"
             id="image"
             name="image"
             [(ngModel)]="newTrip.image"
             placeholder="Example: reef1.jpg"
             required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control"
                id="description"
                name="description"
                rows="4"
                [(ngModel)]="newTrip.description"
                required>
      </textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Add Trip
    </button>

  </form>
</div>
